name: pypi

# Publish royalelearn to PyPI with trusted publishing: no API token anywhere. A `v*` tag starts it,
# or a run by hand from main for a tag that already exists.
#
# It publishes on its own, and only after the release's gates pass:
#   1. The `pypi` environment must exist, and may deploy only from main and `v*` tags. The first
#      step refuses otherwise: a job naming an environment GitHub does not know makes GitHub
#      create it with no rules at all, and then nothing would hold the upload to a release.
#   2. This repository's CI (suite, cross-repo, imitate) must have passed on the tag's own commit. The
#      build waits for those runs to finish and refuses if the newest of any one did not succeed.
#   3. The tag must name the version in pyproject.toml.
# The repository variable PYPI_PUBLISH switches the upload off when it is not true.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing version tag to publish, e.g. v0.5.7'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      REQUIRED: "suite.yml cross-repo.yml imitate.yml"
    steps:
      - name: guard - the pypi environment exists and deploys only from main and v* tags
        run: |
          set -f  # "tag:v*" is a policy's name, never a file pattern
          custom=$(gh api "repos/${GITHUB_REPOSITORY}/environments/pypi" \
            --jq '.deployment_branch_policy.custom_branch_policies // false') || {
            echo "::error::the pypi environment does not exist; create it, limited to main and v* tags"
            exit 1
          }
          if [ "$custom" != "true" ]; then
            echo "::error::the pypi environment deploys from any branch; limit it to main and v* tags"
            exit 1
          fi
          policies=$(gh api "repos/${GITHUB_REPOSITORY}/environments/pypi/deployment-branch-policies" \
            --jq '[.branch_policies[] | "\(.type):\(.name)"] | sort | join(" ")') || {
            echo "::error::could not read the pypi environment's deployment policies"
            exit 1
          }
          echo "deployment policies: $policies"
          case " $policies " in *" tag:v* "*) ;; *)
            echo "::error::the pypi environment does not allow v* tags"
            exit 1;;
          esac
          for policy in $policies; do
            case "$policy" in "tag:v*"|"branch:main") ;; *)
              echo "::error::the pypi environment also deploys from $policy; allow only main and v* tags"
              exit 1;;
            esac
          done

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: guard - this repository's CI passed on the tag's commit
        run: |
          sha=$(git rev-parse HEAD)
          echo "commit $sha"
          for workflow in $REQUIRED; do
            verdict=""
            for attempt in $(seq 1 130); do
              newest=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${sha}&per_page=1" \
                --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"' 2>/dev/null || true)
              case "$newest" in
                "completed success") verdict=pass; break;;
                completed*) verdict="failed: $newest"; break;;
                *) sleep 60;;
              esac
            done
            if [ "$verdict" != "pass" ]; then
              echo "::error::$workflow on $sha has not passed (${verdict:-no finished run within the wait})"
              exit 1
            fi
            echo "$workflow passed on $sha"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: the tag names the version in this tree
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the version in pyproject.toml ($version)"
            exit 1
          fi

      - name: build the wheel and the source archive
        run: |
          python -m pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/royalelearn/
    permissions:
      id-token: write  # trusted publishing, this job only
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
