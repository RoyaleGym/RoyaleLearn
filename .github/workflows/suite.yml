# The fast suite, on a machine that has never seen this project.
#
# Everything this repo has ever been tested on is one developer's Windows box with four sibling
# checkouts already installed. This is the first machine in its life that starts from nothing, so
# a red first run is this file working rather than this file being wrong.
#
# The install is the README's own sequence, in the README's own order, because a workflow that
# installs some other way tests nothing a reader will experience. `royalelearn` declares
# `royalegym` as a dependency and the README says pip takes it from your venv, never from PyPI --
# so RoyaleGym is checked out and installed FIRST, and if that line ever stops being true this job
# is where it shows.
#
# What is NOT here: the Rust toolchain and a royalesim BUILD. `addopts` in pyproject.toml already
# selects `not slow and not engine`, so the tests needing a freshly built engine are deselected,
# and the cross-repo workflow is where a build belongs.
#
# RoyaleSim is still checked out AND its data tables are generated, and the first two runs of
# this file are how that was learnt: 295 tests error without the checkout, and the same 295 error
# again with the checkout but without Stage 3, because the tables are generated rather than
# stored. The fast suite needs no compiled extension and it does need the CARD CATALOGUE, since
# MockEngine reads the same data the real engine does.
#
# The README clones four repos and generates the tables in Stage 3. This workflow first checked
# out two and skipped Stage 3 -- twice the same deviation, both times caught by a machine that
# had never seen the project, which is the whole argument for using the README's own sequence
# rather than what you believe the suite needs.
name: suite

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    # Two operating systems, because a single-OS run cannot see the difference that matters most
    # here: `..` normalises lexically on Windows and is WALKED on POSIX, and this package handles
    # run directories, shared-memory segment names and a peak-working-set reading that is Windows
    # ctypes on one side and /proc on the other. A sibling repo was certified green on a Windows
    # box on 2026-09-23 and failed two tests on a clean Linux one, which is the same lesson from
    # the other direction.
    #
    # fail-fast is off so that one platform going red still reports the other. A green Linux run
    # beside a red Windows one is the useful output; stopping the pair at the first failure would
    # hide which half is platform-specific.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: RoyaleLearn

      # The siblings the README installs before this package, at the same commit a reader would
      # get today. RoyaleViser is optional for the package and NOT optional here: the viser
      # protocol tests `importorskip` it, so without it they pass by not running.
      - uses: actions/checkout@v4
        with:
          repository: RoyaleGym/RoyaleGym
          path: RoyaleGym
      - uses: actions/checkout@v4
        with:
          repository: RoyaleGym/RoyaleViser
          path: RoyaleViser
      # Not installed and not built: only its data/ is needed, and the catalogue is what the
      # environment reads whichever engine is behind it.
      - uses: actions/checkout@v4
        with:
          repository: RoyaleGym/RoyaleSim
          path: RoyaleSim

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # CPU wheels explicitly. The default index serves a CUDA build that is gigabytes larger and
      # would be downloading a GPU runtime onto a runner with no GPU.
      - name: install torch (cpu)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # The README's Stage 3, verbatim. RoyaleSim's data tables are GENERATED rather than stored,
      # so a fresh clone does not have them, and the second run of this workflow is how that was
      # learnt: `data/derived/arena.json is absent` on 295 tests. Seconds, and it has to happen
      # before anything constructs an environment.
      - name: generate RoyaleSim's data tables
        working-directory: RoyaleSim
        # bash on both platforms: the four commands are identical and the forward slashes work
        # under Windows Python, so naming the shell is cheaper than maintaining two copies.
        shell: bash
        run: |
          python tools/extract_arena.py
          python tools/extract_cards.py --vintage 2018
          python tools/extract_cards.py --vintage 2018 --out data/derived/cards.json
          python tools/extract_globals.py

      - name: install
        shell: bash
        run: |
          pip install -e RoyaleGym
          pip install -e RoyaleViser
          pip install -e "RoyaleLearn[torch]"
          pip install -e "RoyaleLearn[dev]"

      - name: ruff
        working-directory: RoyaleLearn
        run: ruff check royalelearn tests

      - name: suite
        working-directory: RoyaleLearn
        # Named rather than left to the sibling-directory search. The search works from this
        # layout, and saying it outright means a change to either layout fails loudly here
        # instead of falling back to "no ROYALESIM_DATA_DIR" and 295 errors.
        env:
          ROYALESIM_DATA_DIR: ${{ github.workspace }}/RoyaleSim/data
        run: pytest -q -p no:randomly

      # The 26 tests the default selection leaves out, ON THE SAME CLEAN RUNNER. Until
      # 2026-09-23 these ran nowhere automatically: they are slow-marked, so CI skipped them by
      # design, and they only executed when a maintainer typed `-m slow` by hand. That meant the
      # RESUME GUARANTEE -- spec 12.4, a run comes back byte for byte in a fresh process -- had
      # no automated coverage at all.
      #
      # A runner is also the only environment they are reliable in. Three of them refuse when a
      # sibling checkout's `git describe` changes between the original run and the resume, which
      # is a correct refusal and happens routinely on a development box where seven sessions
      # share five repositories. A clean runner has nothing else moving.
      #
      # It was `continue-on-error` for exactly one run. That run passed all 26 on both platforms
      # with no skips, which also settles the worry they were added for: the sibling-drift
      # refusal does not happen on a runner, because nothing else is moving there. An
      # allowed-to-fail step gives visibility and not enforcement, and the reason for adding
      # these was that a load-bearing guarantee had no enforcement anywhere. So it enforces.
      - name: slow suite
        working-directory: RoyaleLearn
        env:
          ROYALESIM_DATA_DIR: ${{ github.workspace }}/RoyaleSim/data
        run: pytest -q -p no:randomly -m "slow and not engine"

      # Counts are never recorded without the build digest: a number with no build behind it
      # cannot be compared with the next one.
      - name: record what this run was
        if: always()
        working-directory: RoyaleLearn
        shell: bash
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          try:
              from royalegym.rust_engine import build_digest, core_available
              print("engine build_digest=", build_digest() if core_available() else "no-extension")
          except Exception as exc:
              print("engine build_digest= unavailable:", exc)
          PY
