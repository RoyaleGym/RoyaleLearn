[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "royalelearn"
version = "0.1.0"
description = "RoyaleLearn: self-play PPO training harness for RoyaleGym Clash Royale environments"
requires-python = ">=3.12"
license = { text = "MIT" }
# royalegym is not on PyPI: it is the sibling checkout ../RoyaleGym, installed editable before
# this package by the workspace recipe in README.md (RoyaleSim -> RoyaleGym -> RoyaleViser ->
# RoyaleLearn). pip resolves it from the venv; it never fetches it.
#
# The base install is deliberately torch-free: the ABCs, the config tree, the CLI's config and
# identity commands and the rollout worker all run on numpy and msgspec alone.
dependencies = [
    "royalegym>=0.1.0",
    "numpy>=2.0",
    "msgspec>=0.18",
]

[project.optional-dependencies]
# The learner: networks, the update, inference, and everything that touches a device.
# safetensors is what the snapshot archive and the checkpoint store weights in; nothing this
# package writes is pickled, so it is a requirement of the learner and not an option under it.
torch = [
    "torch>=2.4",
    "safetensors>=0.4",
]
# The optional metrics sink; the JSONL sink is always installed and is never optional.
wandb = [
    "wandb",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "hypothesis>=6.0",
]

[project.scripts]
royalelearn = "royalelearn.cli:main"

[tool.setuptools.packages.find]
include = ["royalelearn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
# The default run is the fast suite. The slow tests and the ones needing a freshly built
# royalesim are selected explicitly, so a bare `pytest -q` stays a few seconds long.
addopts = "-ra --strict-markers -m \"not slow and not engine\""
markers = [
    "slow: takes more than about five seconds",
    "engine: needs a royalesim build that matches the data on disk",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["royalelearn", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# A VENDORED COPY, kept byte-identical to the original in the other three repos so the four can
# be diffed against each other. Reformatting it to this repo's line length would make it a local
# rewrite that only looks like a copy, which is the one thing it must not be.
"tests/_shell_fences.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["royalelearn", "royalegym", "royalesim"]
